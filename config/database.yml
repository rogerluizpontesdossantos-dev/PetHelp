default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: postgresql://127.0.0.1:1234/pethelp_development
  username: <%= ENV["PGUSER"] %>
  password: <%= ENV["PGPASSWORD"] %>

test:
  <<: *default
  url: postgresql://127.0.0.1:1234/pethelp_test
  username: <%= ENV["PGUSER"] %>
  password: <%= ENV["PGPASSWORD"] %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
